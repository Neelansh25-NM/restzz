<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Table Reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page-header { display: flex; justify-content: space-between; align-items: center; min-height: 70px; padding: 14px 30px; background: #fff; border-bottom: 1px solid #e1e8ed; }
        .admin-page-header .brand { color: #3178c6; font-size: 1.5rem; font-weight: 800; text-decoration: none; }
        .admin-page-header .nav-links { display: flex; align-items: center; gap: 26px; }
        .admin-page-header .nav-links a { color: #555; font-weight: 600; text-decoration: none; }
        .admin-page-header .nav-links a:hover, .admin-page-header .nav-links a.active { color: #3178c6; }
        .admin-profile-menu { position: relative; }
        .admin-profile-toggle { display: inline-flex; align-items: center; gap: 10px; min-height: 42px; padding: 7px 14px 7px 8px; border: 1px solid #dfeaf5; border-radius: 999px; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
        .admin-profile-toggle span:first-child { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: #3178c6; color: #fff; font-size: .8rem; }
        .admin-profile-dropdown { position: absolute; top: calc(100% + 8px); right: 0; z-index: 10; display: none; min-width: 180px; overflow: hidden; background: #fff; border: 1px solid #e7edf3; border-radius: 12px; box-shadow: 0 15px 30px rgba(0,0,0,.12); }
        .admin-profile-dropdown.open { display: flex; flex-direction: column; }
        .admin-profile-dropdown a { padding: 12px 14px; color: #333; text-decoration: none; border-bottom: 1px solid #eef3f8; }
        .admin-profile-dropdown a:last-child { color: #d9534f; border-bottom: 0; }
        .floor-plan-header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 28px 0 14px; }
        .floor-plan-header h2 { color: #243447; margin: 0; }
        .floor-plan-header p { color: #667085; margin: 4px 0 0; }
        .floor-plan-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; color: #667085; font-size: .85rem; }
        .legend-dot { display: inline-block; width: 11px; height: 11px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; }
        .legend-free { background: #49b879; }
        .legend-reserved { background: #f2cb45; }
        .legend-occupied { background: #eb3d42; }
        .legend-service { background: #b9c3cf; }
        .tables-grid { padding: 24px; border: 1px solid #dfe7ef; border-radius: 14px; background: #f8fbfd; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .table-item { width: 100%; height: 180px !important; min-height: 180px; padding: 18px 16px 14px; border: 0; border-radius: 12px; box-shadow: 0 4px 12px rgba(36,52,71,.08); display: flex; flex-direction: column; align-items: center; justify-content: flex-start !important; text-align: center; line-height: 1.25; transition: transform .2s, box-shadow .2s; }
        .table-item:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(36,52,71,.14); }
        .table-item strong { font-size: 1.3rem !important; }
        .table-item > span { margin-top: 3px; }
        .table-status-switch { width: 100%; margin-top: 12px; padding: 7px 8px; border: 1px solid rgba(36,52,71,.18); border-radius: 7px; background: rgba(255,255,255,.86); color: #243447; font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; }
        .table-status-switch:focus { outline: 3px solid rgba(49,120,198,.24); outline-offset: 2px; }
        .table-vacant { background: #49b879 !important; color: #fff !important; }
        .table-reserved { background: #f2cb45 !important; color: #5c4a00 !important; }
        .table-occupied { background: #eb3d42 !important; color: #fff !important; }
        .table-unavailable { background: #b9c3cf !important; color: #243447 !important; }
        .allocation-table-select { min-width: 180px; margin-top: 10px; padding: 9px 12px; border: 1px solid #b8d4f2; border-radius: 6px; background: #fff; color: #243447; font: inherit; font-weight: 600; }
        @media (max-width: 760px) { .admin-page-header { flex-wrap: wrap; gap: 12px; padding: 12px 18px; } .admin-page-header .nav-links { order: 3; width: 100%; justify-content: center; gap: 14px; overflow-x: auto; } }
    </style>
</head>     
<body>

    <header class="admin-page-header">
        <a href="index.html" class="brand">🍴 Q-Sense</a>
        <nav class="nav-links">
            <a href="AdminDashboard.html">Overview</a>
            <a href="AdminTableManagement.html" class="active">Tables</a>
            <a href="AdminDashboard.html#live-queue">Queue</a>
        </nav>
        <div class="admin-profile-menu">
            <button id="adminProfileToggle" class="admin-profile-toggle" type="button" aria-expanded="false"><span id="adminNavInitial">A</span><span id="adminNavName">Admin</span><span>▾</span></button>
            <div id="adminProfileDropdown" class="admin-profile-dropdown">
                <a href="AdminDashboard.html">Profile</a>
                <a href="AdminTableManagement.html">Table Overview</a>
                <a href="AdminLogin.html" id="adminLogout">Logout</a>
            </div>
        </div>
    </header>

    <main class="reservation-container" id="main-container">
        
        <div class="stats-row">
            <div class="stat-card">
                <h3>Total Tables</h3>
                <p class="stat-number" id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Free</h3>
                <p class="stat-number vacant-text" id="stat-vacant">0</p>
            </div>
            <div class="stat-card">
                <h3>Occupied / Reserved</h3>
                <p class="stat-number occupied-text" id="stat-occupied">0</p>
            </div>
        </div>

        <div class="floor-plan-header">
            <div>
                <h2>Floor Plan</h2>
                <p>Select a status directly inside each table.</p>
            </div>
            <div class="floor-plan-legend">
                <span><i class="legend-dot legend-free"></i>Free</span>
                <span><i class="legend-dot legend-reserved"></i>Reserved</span>
                <span><i class="legend-dot legend-occupied"></i>Occupied</span>
                <span><i class="legend-dot legend-service"></i>Cleaning / Service</span>
            </div>
        </div>

        <div class="tables-grid" id="floor-plan-grid">
            </div>
        
    </main>

    <footer class="footer">
        <p>&copy; 2026 Q-Sense Inc. &bull; <a href="#">Privacy</a> &bull; <a href="#">Terms</a></p>
    </footer>

    <script>
       
        const urlParams = new URLSearchParams(window.location.search);
        const reserveId = urlParams.get('reserve_id');
        const partySize = urlParams.get('party_size');

        window.addEventListener("DOMContentLoaded", async () => {
            const adminId = localStorage.getItem("admin_id");
            const restaurantId = localStorage.getItem("restaurant_id");

            // Kick out unauthenticated users
            if(!adminId || !restaurantId) {
                window.location.href = "AdminLogin.html";
                return;
            }

            if (reserveId) {
                const mainContainer = document.getElementById("main-container");
                const allocationBanner = document.createElement("div");
                allocationBanner.style.cssText = "background: #eef5fb; border: 1px solid #3178c6; border-radius: 8px; padding: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;";
                allocationBanner.innerHTML = `
                    <div>
                        <h3 style="color: #3178c6; margin: 0; font-size: 1.2rem;">🎯 Table Allocation Mode</h3>
                        <p style="color: #555; margin: 5px 0 0 0; font-size: 0.95rem;">Please select a vacant table below for <strong>Reservation #${reserveId}</strong> (Party of ${partySize}).</p>
                        <select id="allocation-table-select" class="allocation-table-select" aria-label="Choose table number for allocation">
                            <option value="">Choose table number...</option>
                        </select>
                    </div>
                    <button id="final-assign-btn" style="background: #28a745; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: not-allowed; opacity: 0.5; font-size: 1rem; transition: 0.2s;" disabled>
                        Select a Vacant Table
                    </button>
                `;
                mainContainer.insertBefore(allocationBanner, mainContainer.firstChild);
            }

            try {
                // Fetch Admin Profile
                const adminRes = await fetch(`http://localhost:5000/api/admin/${adminId}`);
                if (adminRes.ok) {
                    const adminData = await adminRes.json();
                    const name = adminData.name || localStorage.getItem('admin_email') || 'Admin';
                    document.getElementById('adminNavName').textContent = name;
                    document.getElementById('adminNavInitial').textContent = name.charAt(0).toUpperCase();
                }

               
                const tablesRes = await fetch(`http://localhost:5000/api/tables/restaurant/${restaurantId}`);
                const tables = await tablesRes.json();

                document.getElementById("stat-total").textContent = tables.length;
                document.getElementById("stat-vacant").textContent = tables.filter(t => t.status === 'vacant').length;
                document.getElementById("stat-occupied").textContent = tables.filter(t => t.status === 'occupied' || t.status === 'reserved').length;

                const grid = document.getElementById("floor-plan-grid");
                const allocationSelect = document.getElementById("allocation-table-select");
                grid.innerHTML = ""; 

               
                tables.forEach(table => {
                  
                    const tableDiv = document.createElement("div");
                    tableDiv.className = `table-item table-${table.status}`; 
                    tableDiv.dataset.tableId = table.table_id;
                    tableDiv.style.cursor = "pointer";
                    tableDiv.innerHTML = `<strong>T${table.table_no}</strong><br><span style="font-size: 0.85rem;">${table.capacity} Seats</span><br><span style="font-size: 0.75rem; text-transform: uppercase;">${formatTableStatus(table.status)}</span><select class="table-status-switch" aria-label="Status for table T${table.table_no}"><option value="vacant">Free</option><option value="reserved">Reserved</option><option value="occupied">Occupied</option><option value="unavailable">Cleaning / Under Service</option></select>`;
                    const statusSwitch = tableDiv.querySelector('.table-status-switch');
                    statusSwitch.value = table.status;
                    statusSwitch.addEventListener('click', (event) => event.stopPropagation());
                    statusSwitch.addEventListener('change', () => updateTableStatus(table.table_id, statusSwitch.value));

                    if (allocationSelect) {
                        const allocationOption = document.createElement('option');
                        allocationOption.value = table.table_id;
                        allocationOption.textContent = `T${table.table_no} (${table.capacity} Seats)${table.status === 'vacant' ? '' : ' - unavailable'}`;
                        allocationOption.disabled = table.status !== 'vacant';
                        allocationSelect.appendChild(allocationOption);
                    }
                    
                  
                    tableDiv.onclick = () => {
                     
                        document.querySelectorAll('.table-item').forEach(el => el.style.outline = 'none');
                        tableDiv.style.outline = "3px solid #3178c6";

                        if (reserveId) {
                            const btn = document.getElementById("final-assign-btn");
                            if (table.status === 'vacant') {
                                btn.disabled = false;
                                btn.style.opacity = "1";
                                btn.style.cursor = "pointer";
                                btn.textContent = `✅ Assign T${table.table_no} to Reservation #${reserveId}`;
                                
                                btn.onclick = () => executeAllocation(reserveId, table.table_id);
                            } else {
                                btn.disabled = true;
                                btn.style.opacity = "0.5";
                                btn.style.cursor = "not-allowed";
                                btn.textContent = `Table T${table.table_no} is not vacant`;
                            }
                        }
                    };

                    grid.appendChild(tableDiv);
                });

                if (allocationSelect) {
                    allocationSelect.addEventListener('change', () => {
                        const selectedTable = grid.querySelector(`[data-table-id="${allocationSelect.value}"]`);
                        if (selectedTable) selectedTable.click();
                    });
                }

            } catch(err) {
                console.error("Dashboard error:", err);
            }
        });

        function formatTableStatus(status) {
            return {
                vacant: 'Free',
                reserved: 'Reserved',
                occupied: 'Occupied',
                unavailable: 'Cleaning / Under Service'
            }[status] || status;
        }

        async function updateTableStatus(tableId, status) {
            try {
                const res = await fetch(`http://localhost:5000/api/tables/${tableId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Failed to update table status.');
                window.location.reload();
            } catch (error) {
                console.error('Table status update error:', error);
                alert(error.message);
            }
        }

        const adminProfileToggle = document.getElementById('adminProfileToggle');
        const adminProfileDropdown = document.getElementById('adminProfileDropdown');
        adminProfileToggle.addEventListener('click', (event) => {
            event.stopPropagation();
            const open = adminProfileDropdown.classList.toggle('open');
            adminProfileToggle.setAttribute('aria-expanded', String(open));
        });
        document.addEventListener('click', () => {
            adminProfileDropdown.classList.remove('open');
            adminProfileToggle.setAttribute('aria-expanded', 'false');
        });
        document.getElementById('adminLogout').addEventListener('click', () => localStorage.clear());

        async function executeAllocation(reservationId, tableId) {
            try {
                    const res = await fetch(`http://localhost:5000/api/admin/reservations/${reservationId}/allocate`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_id: tableId })
                });

                if (res.ok) {
                    alert("Table successfully allocated!.");
                    window.location.href = "AdminDashboard.html";
                } else {
                    alert("Failed to allocate table. It may be possible that a server side error has occured.");
                }
            } catch (error) {
                console.error("Allocation Error:", error);
                alert("Network error occurred while allocating.");
            }
        }
    </script>
    <script src="js/navigation.js"></script>
</body>
</html>
