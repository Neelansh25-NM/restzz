<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="icon">🍴</span>
            <h1>Q-Sense</h1>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <div class="user-profile">
                <a href="CustomerLogin.html" class="login-link">Sign In</a>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Create an Account</h2>

            <!-- FLOW D: Form action removed — JS handles redirect to OTP page, not login -->
            <form id="signup">
                <div class="form-row">
                    <div class="input-group">
                        <!-- id added: prevents fragile querySelector('input[type=text]') -->
                        <input type="text" id="name" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <input type="tel" id="phone" placeholder="Phone Number" required>
                </div>

                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>

                <div class="input-group">
                    <input type="password" id="confirm_password" placeholder="Confirm Password" required>
                </div>

                <div class="action-row">
                    <button type="submit" id="signupBtn" class="login-btn">Sign Up</button>
                    <div class="links">
                        <a href="CustomerLogin.html">Already have an account? Log In</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Q-Sense Inc. &bull; <a href="#">Privacy</a> &bull; <a href="#">Terms</a></p>
    </footer>

    <script>
    document.getElementById("signup").addEventListener("submit", async function(e) {
        e.preventDefault();

        const name     = document.getElementById("name").value.trim();
        const email    = document.getElementById("email").value.trim();
        const phone    = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("confirm_password").value;
        const btn      = document.getElementById("signupBtn");

        // Client-side password match check
        if (password !== confirm) {
            alert("Passwords do not match.");
            return;
        }

        btn.textContent = "Creating Account...";
        btn.disabled = true;

        try {
            const res = await fetch("http://localhost:5000/api/users/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, phone, password })
            });

            const data = await res.json();

            if (res.ok && data.requires_otp) {
                // FLOW D: Registration succeeded — store email for OTP page
                // Account is NOT active until OTP is verified
                localStorage.setItem("temp_email", email);
                localStorage.setItem("temp_role", "customer");
                localStorage.setItem("temp_customer_id", data.customer_id);

                // Redirect to OTP verification — NOT to login
                window.location.href = "OtpVerification.html";

            } else if (res.status === 409) {
                alert("An account with this email already exists. Please log in.");

            } else {
                alert(data.error || data.message || "Registration failed. Please try again.");
                btn.textContent = "Sign Up";
                btn.disabled = false;
            }

        } catch (error) {
            console.error("Registration error:", error);
            alert("A network error occurred. Is the server running?");
            btn.textContent = "Sign Up";
            btn.disabled = false;
        }
    });
    </script>

    <script src="js/navigation.js"></script>
</body>
</html>
