<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="icon">🍴</span>
            <h1>Q-Sense</h1>
        </a>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Reset Your Password</h2>
            <p style="color:#666; font-size:14px; margin-top:-10px; margin-bottom:20px;">
                Enter the email on your account and we'll send you a 6-digit code.
            </p>

            <form id="forgotForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="action-row">
                    <button type="submit" id="sendBtn" class="login-btn">Send Reset Code</button>
                    <div class="links">
                        <a id="backLink" href="CustomerLogin.html">&larr; Back to Login</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Q-Sense Inc. &bull; <a href="#">Privacy</a> &bull; <a href="#">Terms</a></p>
    </footer>

    <script>
    // role comes from the query string, e.g. ForgotPassword.html?role=admin
    // Defaults to 'customer' if not present (e.g. someone bookmarked the page).
    const params = new URLSearchParams(window.location.search);
    const role   = params.get("role") === "admin" ? "admin" : "customer";

    document.getElementById("backLink").href = role === "admin" ? "AdminLogin.html" : "CustomerLogin.html";

    document.getElementById("forgotForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const btn   = document.getElementById("sendBtn");

        btn.textContent = "Sending...";
        btn.disabled = true;

        try {
            const res = await fetch("http://localhost:5000/api/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, role })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem("reset_email", email);
                localStorage.setItem("reset_role", role);
                alert(data.message || "If that email is registered, a reset code has been sent.");
                window.location.href = "ResetPassword.html";
            } else {
                alert(data.message || "Something went wrong. Please try again.");
                btn.textContent = "Send Reset Code";
                btn.disabled = false;
            }

        } catch (error) {
            console.error("Forgot password error:", error);
            alert("A network error occurred. Is the server running?");
            btn.textContent = "Send Reset Code";
            btn.disabled = false;
        }
    });
    </script>

    <script src="js/navigation.js"></script>
</body>
</html>
