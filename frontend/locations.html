<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Live Locations (Mumbai)</title>
    
      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        .navbar {
            min-height: 70px;
            padding: 14px 40px;
            position: relative;
            z-index: 2000;
        }

        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            gap: 8px;
            white-space: nowrap;
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .navbar .nav-links a {
            color: #555;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: #3178c6;
        }

        .profile-menu {
            position: relative;
        }

        .profile-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            border: 1px solid #dfeaf5;
            background: #fff;
            color: #1a1a1a;
            border-radius: 999px;
            padding: 7px 14px 7px 8px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }

        .profile-toggle:hover,
        .profile-toggle:focus-visible {
            border-color: #3178c6;
            outline: none;
        }

        #navUserInitial {
            display: inline-flex;
            width: 28px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #3178c6;
            color: #fff;
            font-size: 0.8rem;
        }

        .caret {
            color: #666;
            font-size: 0.8rem;
        }

        .profile-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            display: flex;
            min-width: 190px;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            border: 1px solid #e7edf3;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.12);
        }

        .profile-dropdown.hidden {
            display: none;
        }

        .profile-dropdown a {
            padding: 12px 14px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #eef3f8;
        }

        .profile-dropdown a:hover {
            background: #f4f8fc;
        }

        .profile-dropdown a:last-child {
            color: #d9534f;
            border-bottom: 0;
        }

        @media (max-width: 760px) {
            .navbar {
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px 18px;
            }

            .navbar .nav-links {
                order: 3;
                width: 100%;
                justify-content: center;
                gap: 14px;
                overflow-x: auto;
            }
        }

       
        .locations-wrapper {
            display: flex;
            height: calc(100vh - 70px); 
            overflow: hidden;
        }


        .sidebar {
            width: 390px;
            max-width: 95vw;
            background: white;
            border-right: 1px solid #e1e8ed;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 1000;
            overflow-y: auto;
            overflow-x: hidden;
            height: 100%;
            box-sizing: border-box;
        }

        /* Custom scrollbar styling for smooth scrolling on macOS and trackpads */
        .sidebar::-webkit-scrollbar,
        .restaurant-list::-webkit-scrollbar,
        .detail-content::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb,
        .restaurant-list::-webkit-scrollbar-thumb,
        .detail-content::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb:hover,
        .restaurant-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .sidebar h2 {
            font-size: 1.4rem;
            color: #1e293b;
            margin-bottom: 15px;
        }

        .filter-group {
            margin-bottom: 12px;
        }

        .filter-group label {
            display: block;
            font-size: 0.85rem;
            color: #475569;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .filter-group select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            outline-color: #3178c6;
            background: #f8fafc;
        }

        .restaurant-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 4px;
        }

        .restaurant-card {
            border: 1px solid #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #ffffff;
        }

        .restaurant-card:hover {
            border-color: #3178c6;
            background: #f8faff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(49, 120, 198, 0.08);
        }

        .restaurant-card h3 {
            font-size: 1.05rem;
            color: #3178c6;
            margin-bottom: 4px;
        }

        .restaurant-card p {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
        }

        /* Selected Restaurant Detail Panel in Sidebar */
        .detail-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 20px;
        }

        .back-to-list-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 6px;
            align-self: flex-start;
        }

        .back-to-list-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-card .stat-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .stat-vacant {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .stat-vacant .stat-val {
            color: #16a34a;
        }

        .stat-occupied {
            background: #fef2f2;
            border-color: #fecaca;
        }
        .stat-occupied .stat-val {
            color: #dc2626;
        }

        .stat-wait {
            background: #fefce8;
            border-color: #fef08a;
        }
        .stat-wait .stat-val {
            color: #ca8a04;
        }

        .stat-travel {
            background: #eff6ff;
            border-color: #bfdbfe;
        }
        .stat-travel .stat-val {
            color: #2563eb;
        }

        .tables-badge {
            display: inline-block;
            background: #eef5fb;
            color: #3178c6;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #3178c6;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
        .popup-content h4 { margin: 0 0 5px 0; color: #3178c6; }
        .popup-content p { margin: 0 0 10px 0; font-size: 0.85rem; color: #555; }
        .popup-btn {
            background: #3178c6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
        .route-btn {
            background: #f8f9fa;
            color: #3178c6;
            border: 1px solid #3178c6;
        }

        .heart-location-pin {
            position: relative;
            width: 48px;
            height: 48px;
            filter: drop-shadow(0 2px 2px rgba(66, 37, 99, 0.45));
        }

        .heart-location-pin__shape {
            position: absolute;
            inset: 0;
            color: #aa8bcb;
            font-family: Arial, sans-serif;
            font-size: 52px;
            line-height: 44px;
            -webkit-text-stroke: 2px #5c3d82;
            text-shadow: 0 0 0 #5c3d82;
        }

    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="icon">🍴</span>
            <h1>Q-Sense</h1>
        </a>
        <nav class="nav-links">
            <a href="CustomerHome.html">Home</a>
            <a href="CustomerDashboard.html">Dashboard</a>
            <a href="locations.html" class="active">Locations</a>
            <a href="CustomerReservation.html">Reservation</a>
        </nav>
        <div class="profile-menu">
            <button id="profileToggle" class="profile-toggle" type="button" aria-expanded="false">
                <span id="navUserInitial">U</span>
                <span id="navUserName">Profile</span>
                <span class="caret">▾</span>
            </button>
            <div id="profileDropdown" class="profile-dropdown hidden">
                <a href="CustomerDashboard.html">My Profile</a>
                <a href="CustomerReservation.html">My Reservations</a>
                <a href="#" id="logoutCustomer">Logout</a>
            </div>
        </div>
    </header>

    <main class="locations-wrapper">
        <aside class="sidebar" id="sidebarContainer">
            <div id="sidebarListSection">
                <h2>Find Nearby</h2>
                
                <div class="filter-group">
                    <label>Cuisine Type</label>
                    <select id="cuisineFilter" onchange="applyFilters()">
                        <option value="All">All Cuisines</option>
                        <option value="Asian">Asian / Chinese</option>
                        <option value="Indian">Indian / Modern Indian</option>
                        <option value="Continental">Continental</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Distance from me</label>
                    <select id="distanceFilter" onchange="applyFilters()">
                        <option value="none" selected>None - Show all restaurants</option>
                        <option value="5">Within 5 km</option>
                        <option value="3">Within 3 km</option>
                        <option value="1">Within 1 km</option>
                    </select>
                </div>

                <div class="restaurant-list" id="restaurantList"></div>
            </div>

            <!-- Dynamic & Fully Scrollable Restaurant Detail Panel -->
            <div id="restaurantDetailPanel" class="detail-panel" style="display: none;"></div>
        </aside>

        <div id="map"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
     
        const userLocation = { lat: 19.0600, lng: 72.8350 };
        const map = L.map('map').setView([userLocation.lat, userLocation.lng], 15);

        L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);


        const userLocationIcon = L.divIcon({
            className: 'user-location-marker',
            html: '<div class="heart-location-pin"><span class="heart-location-pin__shape">♥</span></div>',
            iconSize: [48, 48],
            iconAnchor: [24, 48],
            popupAnchor: [0, -48]
        });

        L.marker([userLocation.lat, userLocation.lng], { icon: userLocationIcon })
            .addTo(map)
            .bindPopup('<b>You are here</b><br>Bandra, Mumbai').openPopup();

   
        let restaurants = [
            { id: 4, name: "Foo Bandra", lat: 19.060038, lng: 72.836275, cuisine: "Asian", tablesAvailable: 4, distance: 0.2 },
            { id: 5, name: "Bandra Born", lat: 19.050472, lng: 72.826998, cuisine: "Indian", tablesAvailable: 12, distance: 1.8 },
            { id: 6, name: "Veranda Bandra", lat: 19.066789, lng: 72.830283, cuisine: "Indian", tablesAvailable: 2, distance: 0.8 },
            { id: 7, name: "The Nest Bandra", lat: 19.056281, lng: 72.834321, cuisine: "Continental", tablesAvailable: 8, distance: 0.5 },
            { id: 8, name: "Copper Chimney", lat: 19.060868, lng: 72.836597, cuisine: "Indian", tablesAvailable: 0, distance: 0.3 },
            { id: 9, name: "Q-Sense HQ Diner", lat: 19.1176, lng: 72.9060, cuisine: "Continental", tablesAvailable: 6, distance: 9.8 }
        ];

        let markers = [];
        let walkingRoute;

        function selectRestaurantById(id) {
            const found = restaurants.find(r => r.id === id);
            if (found) selectRestaurant(found);
        }

        async function selectRestaurant(res) {
            map.flyTo([res.lat, res.lng], 16, { animate: true, duration: 0.8 });

            const listSection = document.getElementById('sidebarListSection');
            const detailPanel = document.getElementById('restaurantDetailPanel');
            const sidebar = document.getElementById('sidebarContainer');

            listSection.style.display = 'none';
            detailPanel.style.display = 'flex';
            sidebar.scrollTop = 0;

            const walkMins = Math.max(1, Math.round((res.distance / 4.8) * 60));
            const driveMins = Math.max(1, Math.round((res.distance / 25) * 60));

            detailPanel.innerHTML = `
                <button class="back-to-list-btn" onclick="backToRestaurantList()">
                    &larr; Back to all restaurants
                </button>
                <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                        <h2 style="margin: 0; color: #1e293b; font-size: 1.3rem;">${res.name}</h2>
                        <span class="tables-badge" style="background: #ecfdf5; color: #059669; border-color: #a7f3d0;">Live</span>
                    </div>
                    <p style="color: #64748b; font-size: 0.88rem; margin: 4px 0 0 0;">
                        🍽️ ${res.cuisine} Dining &bull; ${res.location || 'Bandra, Mumbai'}
                    </p>
                </div>
                <div style="text-align: center; padding: 25px 0; color: #64748b; font-size: 0.9rem;">
                    Loading live table & waitlist status...
                </div>
            `;

            try {
                let liveData = null;
                try {
                    const statusRes = await fetch(`http://localhost:5000/api/restaurant/${res.id}/live-status`);
                    if (statusRes.ok) {
                        liveData = await statusRes.json();
                    }
                } catch (e) {
                    console.warn('Could not load live status, fallback to local defaults', e);
                }

                const vacant = liveData ? liveData.tables.vacant : (res.tablesAvailable ?? 4);
                const occupied = liveData ? liveData.tables.occupied : 2;
                const reserved = liveData ? liveData.tables.reserved : 1;
                const waitingCount = liveData ? liveData.queue.waiting_count : 0;
                const waitMinutes = liveData ? liveData.queue.estimated_wait_minutes : (waitingCount * 5);
                const totalTables = liveData ? liveData.tables.total : (vacant + occupied + reserved);

                detailPanel.innerHTML = `
                    <button class="back-to-list-btn" onclick="backToRestaurantList()">
                        &larr; Back to all restaurants
                    </button>

                    <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">
                            <h2 style="margin: 0; color: #1e293b; font-size: 1.3rem;">${res.name}</h2>
                            <span class="tables-badge" style="background: #ecfdf5; color: #059669; border-color: #a7f3d0;">
                                ${res.status === 'closed' ? 'Closed' : '🟢 Open Now'}
                            </span>
                        </div>
                        <p style="color: #64748b; font-size: 0.88rem; margin: 6px 0 0 0;">
                            🍽️ ${res.cuisine} &bull; ${res.location || 'Bandra, Mumbai'}
                        </p>
                    </div>

                    <!-- Travel & Distance Section -->
                    <div class="stat-card stat-travel">
                        <span class="stat-label">📍 Distance & Travel Time</span>
                        <div class="stat-val" style="font-size: 1.05rem;">
                            🚶 ~${walkMins} mins walk <span style="font-size: 0.85rem; font-weight: normal; color: #64748b;">(${res.distance} km)</span>
                        </div>
                        <div style="font-size: 0.8rem; color: #64748b; margin-top: 4px;">
                            🚗 ~${driveMins} mins by car/cab
                        </div>
                    </div>

                    <!-- Live Wait & Table Stats Grid -->
                    <div class="stats-grid">
                        <div class="stat-card stat-wait">
                            <span class="stat-label">👥 Live Waitlist</span>
                            <div class="stat-val">${waitingCount} <span style="font-size: 0.8rem; font-weight: normal;">parties</span></div>
                            <span style="font-size: 0.75rem; color: #854d0e; margin-top: 2px;">
                                ${waitingCount > 0 ? `~${waitMinutes} min wait` : 'No wait right now!'}
                            </span>
                        </div>

                        <div class="stat-card stat-vacant">
                            <span class="stat-label">🟢 Vacant Tables</span>
                            <div class="stat-val">${vacant} <span style="font-size: 0.8rem; font-weight: normal;">free</span></div>
                            <span style="font-size: 0.75rem; color: #15803d; margin-top: 2px;">
                                Out of ${totalTables} total
                            </span>
                        </div>

                        <div class="stat-card stat-occupied">
                            <span class="stat-label">🔴 Occupied Tables</span>
                            <div class="stat-val">${occupied} <span style="font-size: 0.8rem; font-weight: normal;">seated</span></div>
                            <span style="font-size: 0.75rem; color: #b91c1c; margin-top: 2px;">Currently dining</span>
                        </div>

                        <div class="stat-card" style="background: #faf5ff; border-color: #e9d5ff;">
                            <span class="stat-label" style="color: #7e22ce;">📅 Reserved</span>
                            <div class="stat-val" style="color: #6b21a8;">${reserved} <span style="font-size: 0.8rem; font-weight: normal;">booked</span></div>
                            <span style="font-size: 0.75rem; color: #9333ea; margin-top: 2px;">Upcoming today</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px;">
                        <button class="popup-btn" style="padding: 10px; font-size: 0.95rem;" onclick="window.location.href='CustomerReservation.html?restaurant_id=${res.id}'">
                            📅 Book a Table
                        </button>
                        <button class="popup-btn" style="padding: 10px; font-size: 0.95rem; background: #f8f9fa; color: #3178c6; border: 1px solid #3178c6;" onclick="window.location.href='JoinQueue.html?restaurant_id=${res.id}'">
                            🚶 Join Live Queue
                        </button>
                        <button class="popup-btn route-btn" style="padding: 10px; font-size: 0.95rem;" onclick='showWalkingRoute(${res.lat}, ${res.lng}, ${JSON.stringify(res.name)})'>
                            🗺️ Draw Walking Route on Map
                        </button>
                    </div>
                `;
            } catch (err) {
                console.error('Error rendering restaurant details:', err);
            }
        }

        function backToRestaurantList() {
            document.getElementById('restaurantDetailPanel').style.display = 'none';
            document.getElementById('sidebarListSection').style.display = 'block';
            document.getElementById('sidebarContainer').scrollTop = 0;
            map.setView([userLocation.lat, userLocation.lng], 15);
        }

        function renderData(data) {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
  
            const listContainer = document.getElementById('restaurantList');
            listContainer.innerHTML = '';

            data.forEach(res => {
                const walkMins = Math.max(1, Math.round((res.distance / 4.8) * 60));
                let marker = L.marker([res.lat, res.lng]).addTo(map)
                .bindPopup(`
                    <div class="popup-content">
                        <h4>${res.name}</h4>
                        <p>${res.cuisine} &bull; ${res.distance} km away (~${walkMins}m walk)</p>
                        <div style="display: flex; gap: 8px; flex-direction: column; margin-top: 8px;">
                            <button class="popup-btn" onclick="selectRestaurantById(${res.id})">
                                📊 View Live Details & Tables
                            </button>
                            <button class="popup-btn" style="background: #f8f9fa; color: #3178c6; border: 1px solid #3178c6;" onclick="window.location.href='JoinQueue.html?restaurant_id=${res.id}'">
                                🚶 Join Live Queue
                            </button>
                            <button class="popup-btn route-btn" onclick='showWalkingRoute(${res.lat}, ${res.lng}, ${JSON.stringify(res.name)})'>
                                🗺️ Route
                            </button>
                        </div>
                    </div>
                `);
                markers.push(marker);

                listContainer.innerHTML += `
                    <div class="restaurant-card" onclick="selectRestaurantById(${res.id})">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <h3>${res.name}</h3>
                            <span class="tables-badge">🚶 ~${walkMins}m</span>
                        </div>
                        <p>${res.cuisine} &bull; ${res.distance} km away</p>
                        <div style="font-size: 0.78rem; color: #0284c7; font-weight: 600;">
                            View live waitlist & tables &rarr;
                        </div>
                    </div>
                `;
            });
        }

        // 4. Filtering Logic based on User Input
        function applyFilters() {
            const selectedCuisine = document.getElementById('cuisineFilter').value;
            const selectedDistance = document.getElementById('distanceFilter').value;
            const maxDistance = selectedDistance === 'none' ? null : parseFloat(selectedDistance);

            const filteredData = restaurants.filter(res => {
                const cuisineMatch = selectedCuisine === "All" || res.cuisine === selectedCuisine;
                const distanceMatch = maxDistance === null || res.distance <= maxDistance;
                return cuisineMatch && distanceMatch;
            });

            renderData(filteredData);
        }

        function distanceFromUser(lat, lng) {
            const earthRadiusKm = 6371;
            const toRadians = degrees => degrees * Math.PI / 180;
            const latDifference = toRadians(lat - userLocation.lat);
            const lngDifference = toRadians(lng - userLocation.lng);
            const a = Math.sin(latDifference / 2) ** 2
                + Math.cos(toRadians(userLocation.lat)) * Math.cos(toRadians(lat))
                * Math.sin(lngDifference / 2) ** 2;
            return Math.round(earthRadiusKm * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 10) / 10;
        }

        // Keep the map in sync with restaurants added through the admin flow.
        async function loadRegisteredRestaurants() {
            try {
                const response = await fetch('http://localhost:5000/api/restaurant');
                if (!response.ok) throw new Error('Restaurant API request failed');

                const registeredRestaurants = await response.json();
                const restaurantsByName = new Map(restaurants.map(restaurant => [restaurant.name.toLowerCase(), restaurant]));

                registeredRestaurants
                    .filter(restaurant => restaurant.latitude != null && restaurant.longitude != null)
                    .forEach(restaurant => {
                        const lat = Number(restaurant.latitude);
                        const lng = Number(restaurant.longitude);
                        restaurantsByName.set(restaurant.name.toLowerCase(), {
                            id: restaurant.restaurant_id,
                            name: restaurant.name,
                            lat,
                            lng,
                            cuisine: 'Other',
                            tablesAvailable: restaurant.status === 'open' ? 1 : 0,
                            distance: distanceFromUser(lat, lng)
                        });
                    });

                restaurants = Array.from(restaurantsByName.values());
                applyFilters();
            } catch (error) {
                // The static entries keep the page usable when the local API is offline.
                console.warn('Registered restaurants could not be loaded:', error);
            }
        }

        // Draw a pedestrian route from the "You are here" marker to the selected restaurant.
        async function showWalkingRoute(destinationLat, destinationLng, restaurantName) {
            if (walkingRoute) {
                map.removeLayer(walkingRoute);
            }

            const fallbackRoute = () => {
                walkingRoute = L.polyline(
                    [[userLocation.lat, userLocation.lng], [destinationLat, destinationLng]],
                    { color: '#3178c6', weight: 5, opacity: 0.85, dashArray: '8 8' }
                ).addTo(map);
                map.fitBounds(walkingRoute.getBounds(), { padding: [40, 40] });
                alert(`Walking directions are unavailable right now. Showing the direct path to ${restaurantName}.`);
            };

            try {
                const routeUrl = `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${userLocation.lng},${userLocation.lat};${destinationLng},${destinationLat}?overview=full&geometries=geojson`;
                const response = await fetch(routeUrl);
                const routeData = await response.json();

                if (!response.ok || !routeData.routes || !routeData.routes.length) {
                    throw new Error('No walking route returned');
                }

                const routePoints = routeData.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
                walkingRoute = L.polyline(routePoints, {
                    color: '#3178c6',
                    weight: 5,
                    opacity: 0.85
                }).addTo(map);
                map.fitBounds(walkingRoute.getBounds(), { padding: [40, 40] });
            } catch (error) {
                console.warn('Walking route could not be loaded:', error);
                fallbackRoute();
            }
        }

        // Initial render on page load
        renderData(restaurants);
        loadRegisteredRestaurants();


    const profileToggle = document.getElementById('profileToggle');
    const profileDropdown = document.getElementById('profileDropdown');
    const logoutCustomerLink = document.getElementById('logoutCustomer');

    function populateProfileMenu() {
        const name = localStorage.getItem('customer_name') || localStorage.getItem('customer_email') || 'User';
        const firstLetter = name.trim().charAt(0).toUpperCase() || 'U';
        document.getElementById('navUserInitial').textContent = firstLetter;
        document.getElementById('navUserName').textContent = name || 'Profile';
    }

    profileToggle.addEventListener('click', () => {
        profileDropdown.classList.toggle('hidden');
        profileToggle.setAttribute('aria-expanded', profileDropdown.classList.contains('hidden') ? 'false' : 'true');
    });

    document.addEventListener('click', (event) => {
        if (!event.target.closest('.profile-menu')) {
            profileDropdown.classList.add('hidden');
            profileToggle.setAttribute('aria-expanded', 'false');
        }
    });

    logoutCustomerLink.addEventListener('click', (event) => {
        event.preventDefault();
        localStorage.clear();
        window.location.href = 'CustomerLogin.html';
    });

    populateProfileMenu();

    window.addEventListener("DOMContentLoaded", async () => {

    const userId = localStorage.getItem("customer_id");

    if(!userId) return;

    try{

        const res = await fetch(`http://localhost:5000/api/users/${userId}`);
        const data = await res.json();

        const name = data.name || 'Profile';
        document.getElementById('navUserName').textContent = name;
        document.getElementById('navUserInitial').textContent = name.charAt(0).toUpperCase();

    }
    catch(err){
        console.error(err);
    }

});
    </script>

    <div id="qsense-chatbot" style="position: fixed; right: 22px; bottom: 22px; z-index: 9999; font-family: 'Inter', sans-serif;">
        <button id="chatbot-toggle" type="button" style="width: 64px; height: 64px; border: none; border-radius: 50%; background: linear-gradient(135deg, #3178c6, #245ea3); color: white; font-size: 28px; box-shadow: 0 12px 30px rgba(49,120,198,0.35); cursor: pointer;">💬</button>
        <div id="chatbot-panel" style="display: none; width: 340px; max-width: calc(100vw - 24px); background: white; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.14); border: 1px solid #e7edf3; overflow: hidden; margin-bottom: 12px;">
            <div style="padding: 14px 16px; background: #3178c6; color: white; font-weight: 700; display: flex; align-items: center; justify-content: space-between;">
                <span>Q-Sense Assistant</span>
                <button id="chatbot-close" type="button" style="background: transparent; border: none; color: white; font-size: 28px; cursor: pointer; line-height: 1;">×</button>
            </div>
            <div id="chatbot-messages" style="height: 260px; overflow-y: auto; padding: 14px; background: #f7fafd; display: flex; flex-direction: column; gap: 10px;">
                <div style="max-width: 82%; background: white; border: 1px solid #e5ecf3; border-radius: 12px 12px 12px 4px; padding: 10px 12px; color: #334; font-size: 0.92rem;">Hi! Ask about reservations, queues, table availability, or restaurant info.</div>
            </div>
            <form id="chatbot-form" style="display: flex; border-top: 1px solid #e7edf3; padding: 10px; background: white; gap: 8px;">
                <input id="chatbot-input" type="text" placeholder="Ask about bookings or queues..." style="flex: 1; border: 1px solid #dfeaf5; border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; outline: none;" />
                <button type="submit" style="background: #3178c6; color: white; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer;">Send</button>
            </form>
        </div>
    </div>

    <script>
        const chatbotToggle = document.getElementById('chatbot-toggle');
        const chatbotPanel = document.getElementById('chatbot-panel');
        const chatbotClose = document.getElementById('chatbot-close');
        const chatbotForm = document.getElementById('chatbot-form');
        const chatbotInput = document.getElementById('chatbot-input');
        const chatbotMessages = document.getElementById('chatbot-messages');

        function appendChatbotMessage(text, isUser = false) {
            const bubble = document.createElement('div');
            bubble.style.maxWidth = '82%';
            bubble.style.padding = '10px 12px';
            bubble.style.borderRadius = isUser ? '12px 12px 4px 12px' : '12px 12px 12px 4px';
            bubble.style.alignSelf = isUser ? 'flex-end' : 'flex-start';
            bubble.style.background = isUser ? '#3178c6' : '#ffffff';
            bubble.style.color = isUser ? '#fff' : '#2e3a46';
            bubble.style.border = isUser ? 'none' : '1px solid #e5ecf3';
            bubble.style.fontSize = '0.92rem';
            bubble.textContent = text;
            chatbotMessages.appendChild(bubble);
            chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        }

        chatbotToggle.addEventListener('click', () => {
            chatbotPanel.style.display = chatbotPanel.style.display === 'none' ? 'block' : 'none';
        });

        chatbotClose.addEventListener('click', () => {
            chatbotPanel.style.display = 'none';
        });

        chatbotForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = chatbotInput.value.trim();
            if (!message) return;

            appendChatbotMessage(message, true);
            chatbotInput.value = '';

            try {
                const customerId = localStorage.getItem('customer_id');
                const response = await fetch('http://localhost:5000/api/chatbots/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('auth_token') || ''}`
                    },
                    body: JSON.stringify({ message, userId: customerId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'The assistant could not answer right now.');
                appendChatbotMessage(data.reply || 'I can help with reservations, queues, and restaurant info only.', false);
            } catch (error) {
                console.error('Chatbot request failed:', error);
                appendChatbotMessage('The assistant is unavailable right now. Please check the backend and Gemini API key.', false);
            }
        });
    </script>

    <script src="js/navigation.js"></script>
