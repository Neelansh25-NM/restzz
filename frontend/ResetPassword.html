<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="icon">🍴</span>
            <h1>Q-Sense</h1>
        </a>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>Enter Reset Code</h2>
            <p style="color:#666; font-size:14px; margin-top:-10px; margin-bottom:20px;">
                Check <strong id="emailDisplay"></strong> for a 6-digit code.
            </p>

            <form id="resetForm">
                <div class="input-group">
                    <input type="text" id="otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" required>
                </div>
                <div class="input-group">
                    <input type="password" id="newPassword" placeholder="New Password (min 8 characters)" minlength="8" required>
                </div>
                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm New Password" minlength="8" required>
                </div>
                <div class="action-row">
                    <button type="submit" id="resetBtn" class="login-btn">Reset Password</button>
                    <div class="links">
                        <a href="#" id="resendLink">Resend code</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Q-Sense Inc. &bull; <a href="#">Privacy</a> &bull; <a href="#">Terms</a></p>
    </footer>

    <script>
    const email = localStorage.getItem("reset_email");
    const role  = localStorage.getItem("reset_role") || "customer";

    if (!email) {
        // Nobody went through Forgot Password first — send them back
        window.location.href = "CustomerLogin.html";
    } else {
        document.getElementById("emailDisplay").textContent = email;
    }

    document.getElementById("resendLink").addEventListener("click", async function(e) {
        e.preventDefault();
        try {
            const res = await fetch("http://localhost:5000/api/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, role })
            });
            const data = await res.json();
            alert(data.message || "If that email is registered, a new code has been sent.");
        } catch (error) {
            alert("A network error occurred. Is the server running?");
        }
    });

    document.getElementById("resetForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const otp             = document.getElementById("otp").value.trim();
        const newPassword     = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const btn             = document.getElementById("resetBtn");

        if (newPassword !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        btn.textContent = "Resetting...";
        btn.disabled = true;

        try {
            const res = await fetch("http://localhost:5000/api/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, otp, newPassword, role })
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.removeItem("reset_email");
                localStorage.removeItem("reset_role");
                alert(data.message || "Password reset successfully. You can now log in.");
                window.location.href = role === "admin" ? "AdminLogin.html" : "CustomerLogin.html";
            } else {
                alert(data.message || "Reset failed. Please check your code and try again.");
                btn.textContent = "Reset Password";
                btn.disabled = false;
            }

        } catch (error) {
            console.error("Reset password error:", error);
            alert("A network error occurred. Is the server running?");
            btn.textContent = "Reset Password";
            btn.disabled = false;
        }
    });
    </script>

    <script src="js/navigation.js"></script>
</body>
</html>
