<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f7f9; color: #333; }

   
        .navbar {
            background: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e1e8ed;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: #3178c6; display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; align-items: center; gap: 24px; }
        .nav-links a { text-decoration: none; color: #555; font-weight: 500; transition: 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: #3178c6; }
        .profile-menu { position: relative; }
        .profile-toggle {
            display: inline-flex; align-items: center; gap: 10px; border: 1px solid #dfeaf5; background: white;
            color: #1a1a1a; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600;
        }
        .profile-toggle #navUserInitial {
            display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: #3178c6; color: white;
            align-items: center; justify-content: center; font-size: 0.8rem;
        }
        .caret { font-size: 0.8rem; color: #666; }
        .profile-dropdown {
            position: absolute; right: 0; top: calc(100% + 8px); background: white; border: 1px solid #e7edf3; border-radius: 12px;
            min-width: 180px; box-shadow: 0 15px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden;
        }
        .profile-dropdown.hidden { display: none; }
        .profile-dropdown a { padding: 12px 14px; text-decoration: none; color: #333; border-bottom: 1px solid #eef3f8; }
        .profile-dropdown a:last-child { color: #d9534f; border-bottom: none; }

        
        .app-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }

  
        .greeting-section { margin-bottom: 40px; animation: fadeInDown 0.8s ease-out; }
        .greeting-title { font-size: 2.8rem; font-weight: 800; color: #1a1a1a; letter-spacing: -1px; }
        .greeting-subtitle { font-size: 1.1rem; color: #666; margin-top: 8px; }

  
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            border-bottom: 2px solid #e1e8ed;
            padding-bottom: 10px;
        }
        .section-header h2 { font-size: 1.5rem; color: #333; }
        .view-all { color: #3178c6; text-decoration: none; font-weight: 600; font-size: 0.9rem; }

     
        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            animation: fadeIn 1s ease-out;
        }

        .restaurant-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
        }
        .restaurant-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border-color: #b8d4f2;
        }

        .card-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .card-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .card-content h3 { font-size: 1.25rem; color: #1a1a1a; margin-bottom: 5px; }
        .card-content p { color: #666; font-size: 0.9rem; margin-bottom: 15px; }
        
        .badges { display: flex; gap: 8px; margin-bottom: 20px; }
        .badge { background: #eef5fb; color: #3178c6; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        .badge.queue { background: #fff3cd; color: #856404; }

        .card-actions { display: flex; gap: 10px; margin-top: auto; }
        .btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .btn-primary { background: #3178c6; color: white; border: 1px solid #3178c6; }
        .btn-primary:hover { background: #255a96; }
        .btn-secondary { background: white; color: #3178c6; border: 1px solid #3178c6; }
        .btn-secondary:hover { background: #eef5fb; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">🍴 Q-Sense</a>
        <nav class="nav-links">
            <a href="CustomerHome.html" class="active">Home</a>
            <a href="CustomerDashboard.html">Dashboard</a>
            <a href="locations.html">Locations</a>
            <a href="CustomerReservation.html">Reservation</a>
        </nav>
        <div class="profile-menu">
            <button id="profileToggle" class="profile-toggle" type="button" aria-expanded="false">
                <span id="navUserInitial">U</span>
                <span id="navUserName">Profile</span>
                <span class="caret">▾</span>
            </button>
            <div id="profileDropdown" class="profile-dropdown hidden">
                <a href="CustomerDashboard.html">My Profile</a>
                <a href="CustomerReservation.html">My Reservations</a>
                <a href="#" id="logoutCustomer">Logout</a>
            </div>
        </div>
    </header>

    <main class="app-container">
        
        <section class="greeting-section">
            <h1 class="greeting-title" id="user-greeting">Hi there. Let's get started.</h1>
            <p class="greeting-subtitle">Find a table, join a live waitlist, and skip the line.</p>
        </section>

        <div class="section-header">
            <h2>Explore Most Popular Locations</h2>
            <a href="#" class="view-all"></a>
        </div>

        <section class="locations-grid" id="locations-container">
            </section>

    </main>

    <div id="qsense-chatbot" style="position: fixed; right: 22px; bottom: 22px; z-index: 9999; font-family: 'Inter', sans-serif;">
        <button id="chatbot-toggle" type="button" style="width: 64px; height: 64px; border: none; border-radius: 50%; background: linear-gradient(135deg, #3178c6, #245ea3); color: white; font-size: 28px; box-shadow: 0 12px 30px rgba(49,120,198,0.35); cursor: pointer;">💬</button>

        <div id="chatbot-panel" style="display: none; width: 340px; max-width: calc(100vw - 24px); background: white; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.14); border: 1px solid #e7edf3; overflow: hidden; margin-bottom: 12px;">
            <div style="padding: 14px 16px; background: #3178c6; color: white; font-weight: 700; display: flex; align-items: center; justify-content: space-between;">
                <span>Q-Sense Assistant</span>
                <button id="chatbot-close" type="button" style="background: transparent; border: none; color: white; font-size: 28px; cursor: pointer; line-height: 1;">×</button>
            </div>

            <div id="chatbot-messages" style="height: 260px; overflow-y: auto; padding: 14px; background: #f7fafd; display: flex; flex-direction: column; gap: 10px;">
                <div style="max-width: 82%; background: white; border: 1px solid #e5ecf3; border-radius: 12px 12px 12px 4px; padding: 10px 12px; color: #334; font-size: 0.92rem;">Hi! Ask about reservations, queues, table availability, or restaurant info.</div>
            </div>

            <form id="chatbot-form" style="display: flex; border-top: 1px solid #e7edf3; padding: 10px; background: white; gap: 8px;">
                <input id="chatbot-input" type="text" placeholder="Ask about bookings or queues..." style="flex: 1; border: 1px solid #dfeaf5; border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; outline: none;" />
                <button type="submit" style="background: #3178c6; color: white; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer;">Send</button>
            </form>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const customerId = localStorage.getItem('customer_id');
            let customerName = localStorage.getItem('customer_name') || localStorage.getItem('customer_email');

              if (!customerId) {
                window.location.href = "index.html"; 
                return;
            }

        
            if (customerName) {
                const firstName = customerName.split(' ')[0].split('@')[0]; 
                document.getElementById('user-greeting').textContent = `Hi ${firstName}. Let's get started.`;
            }

            loadPopularLocations();
        });

     
      async function loadPopularLocations() {
            const container = document.getElementById('locations-container');
            container.innerHTML = "<p style='padding: 20px; color: #666;'>Loading popular locations...</p>";
            
            try {
               
                const res = await fetch('http://localhost:5000/api/restaurant');
                const restaurants = await res.json();

                if (!res.ok) throw new Error("Failed to fetch");

                container.innerHTML = ""; 

    
                restaurants.forEach(rest => {
                    const card = document.createElement('div');
                    card.className = 'restaurant-card';
                    
                   
                    const imgUrl = rest.image_url || "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=600&q=80";
                    const subtitle = rest.location || "Premium Dining"; 

                    
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${rest.name}" class="card-image">
                        <div class="card-content">
                            <h3>${rest.name}</h3>
                            <p>${subtitle}</p>
                            
                            <div class="badges">
                                <span class="badge">📅 Reservations</span>
                                <span class="badge queue">🚶 Live Queue</span>
                            </div>
                            
                            <div class="card-actions">
                                <a href="CustomerReservation.html?restaurant_id=${rest.restaurant_id}" class="btn btn-primary">Book Table</a>
                                <a href="JoinQueue.html?restaurant_id=${rest.restaurant_id}" class="btn btn-secondary">Join Line</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading restaurants:", error);
                container.innerHTML = "<p style='color: #d9534f; padding: 20px;'>Failed to load locations. Is your server running?</p>";
            }
        }

        function logoutCustomer() {
            localStorage.removeItem('customer_id');
            localStorage.removeItem('customer_name');
            localStorage.removeItem('customer_email');
            localStorage.removeItem('email');
            window.location.href = "index.html"; 
        }

        const profileToggle = document.getElementById('profileToggle');
        const profileDropdown = document.getElementById('profileDropdown');
        const logoutCustomerLink = document.getElementById('logoutCustomer');

        function populateProfileMenu() {
            const name = localStorage.getItem('customer_name') || localStorage.getItem('customer_email') || 'User';
            const firstLetter = name.trim().charAt(0).toUpperCase() || 'U';
            document.getElementById('navUserInitial').textContent = firstLetter;
            document.getElementById('navUserName').textContent = name || 'Profile';
        }

        profileToggle.addEventListener('click', () => {
            profileDropdown.classList.toggle('hidden');
            profileToggle.setAttribute('aria-expanded', profileDropdown.classList.contains('hidden') ? 'false' : 'true');
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.profile-menu')) {
                profileDropdown.classList.add('hidden');
                profileToggle.setAttribute('aria-expanded', 'false');
            }
        });

        logoutCustomerLink.addEventListener('click', (event) => {
            event.preventDefault();
            logoutCustomer();
        });

        populateProfileMenu();

        const chatbotToggle = document.getElementById('chatbot-toggle');
        const chatbotPanel = document.getElementById('chatbot-panel');
        const chatbotClose = document.getElementById('chatbot-close');
        const chatbotForm = document.getElementById('chatbot-form');
        const chatbotInput = document.getElementById('chatbot-input');
        const chatbotMessages = document.getElementById('chatbot-messages');

        function appendChatbotMessage(text, isUser = false) {
            const bubble = document.createElement('div');
            bubble.style.maxWidth = '82%';
            bubble.style.padding = '10px 12px';
            bubble.style.borderRadius = isUser ? '12px 12px 4px 12px' : '12px 12px 12px 4px';
            bubble.style.alignSelf = isUser ? 'flex-end' : 'flex-start';
            bubble.style.background = isUser ? '#3178c6' : '#ffffff';
            bubble.style.color = isUser ? '#fff' : '#2e3a46';
            bubble.style.border = isUser ? 'none' : '1px solid #e5ecf3';
            bubble.style.fontSize = '0.92rem';
            bubble.textContent = text;
            chatbotMessages.appendChild(bubble);
            chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        }

        chatbotToggle.addEventListener('click', () => {
            chatbotPanel.style.display = chatbotPanel.style.display === 'none' ? 'block' : 'none';
        });

        chatbotClose.addEventListener('click', () => {
            chatbotPanel.style.display = 'none';
        });

        chatbotForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = chatbotInput.value.trim();
            if (!message) return;

            appendChatbotMessage(message, true);
            chatbotInput.value = '';

            try {
                const customerId = localStorage.getItem('customer_id');
                const response = await fetch('http://localhost:5000/api/chatbots/message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('auth_token') || ''}`
                    },
                    body: JSON.stringify({ message, userId: customerId })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'The assistant could not answer right now.');
                const reply = data.reply || 'I can help with reservations, queues, and restaurant info only.';
                appendChatbotMessage(reply, false);
            } catch (error) {
                console.error('Chatbot request failed:', error);
                appendChatbotMessage('The assistant is unavailable right now. Please check the backend and Gemini API key.', false);
            }
        });
    </script>
    <script src="js/navigation.js"></script>
</body>
</html>
