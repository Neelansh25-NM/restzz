<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Sense | Book a Table</title>
         <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 32px; background: #fff; border-bottom: 1px solid #e4edf3; }
        .logo { display: flex; align-items: center; gap: 10px; color: #3178c6; font-weight: 800; }
        .nav-links { display: flex; gap: 24px; align-items: center; }
        .nav-links a { text-decoration: none; color: #555; font-weight: 600; }
        .nav-links a.active, .nav-links a:hover { color: #3178c6; }
        .profile-menu { position: relative; }
        .profile-toggle { display: inline-flex; align-items: center; gap: 10px; border: 1px solid #dfeaf5; background: white; color: #1a1a1a; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
        .profile-toggle #navUserInitial { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: #3178c6; color: white; align-items: center; justify-content: center; font-size: 0.8rem; }
        .profile-dropdown { position: absolute; right: 0; top: calc(100% + 8px); background: white; border: 1px solid #e7edf3; border-radius: 12px; min-width: 180px; box-shadow: 0 15px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
        .profile-dropdown.hidden { display: none; }
        .profile-dropdown a { padding: 12px 14px; text-decoration: none; color: #333; border-bottom: 1px solid #eef3f8; }
        .profile-dropdown a:last-child { color: #d9534f; border-bottom: none; }
        .caret { font-size: 0.8rem; color: #666; }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="icon">🍴</span>
            <h1>Q-Sense</h1>
        </a>
        <nav class="nav-links">
            <a href="CustomerHome.html">Home</a>
            <a href="CustomerDashboard.html">Dashboard</a>
            <a href="locations.html">Locations</a>
            <a href="CustomerReservation.html" class="active">Reservation</a>
        </nav>
        <div class="profile-menu">
            <button id="profileToggle" class="profile-toggle" type="button" aria-expanded="false">
                <span id="navUserInitial">U</span>
                <span id="navUserName">Profile</span>
                <span class="caret">▾</span>
            </button>
            <div id="profileDropdown" class="profile-dropdown hidden">
                <a href="CustomerDashboard.html">My Profile</a>
                <a href="CustomerReservation.html">My Reservations</a>
                <a href="#" id="logoutCustomer">Logout</a>
            </div>
        </div>
    </header>

    <main class="customer-booking-container">
        <div class="booking-card">
            <div class="booking-header">
                <h2>Find a Table</h2>
                <p>Reserve your spot at any of our Q-Sense locations.</p>
            </div>

            <form id = "reserveForm">
                <div class="search-criteria">
                    <div class="input-group">
                        <label>Location</label>
                        <select id = "restaurantSelect" required>
                            <option value="">Select a restaurant...</option>
                            <option value="1">Q-Sense Downtown</option>
                            <option value="2">Q-Sense Uptown</option>
                            <option value="3">Q-Sense Bay Area</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="input-group">
                            <label>Party Size</label>
                            <select id = "groupSize" required>
                                <option value="2">2 People</option>
                                <option value="3">3 People</option>
                                <option value="4">4 People</option>
                                <option value="5">5 People</option>
                                <option value="6">6 People</option>
                                <option value="7">7+ (Call Restaurant)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Date</label>
                            <input type="date"  id = "reserveDate" required>
                        </div>
                    </div>
                </div>

                <div class="time-selection">
                    <label>Available Times</label>
                    <div class="time-slots">
                        <select id = "reserveTime">
                            <option value = '18:00:00'>6 PM</option>
                            <option value = '18:30:00'>6:30 PM</option>
                             <option value = '19:00:00'>7 PM</option>
                             <option value = '19:30:00'>7:30 PM</option>
                              <option value = '20:00:00'>8 PM</option>
                        </select>
                    </div>
                </div>

                <div class="guest-details">
                    <label style = "margin-bottom: 5px;">Your Details</label>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="text" placeholder="Name" required>
                        </div>
                       
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <input type="email" placeholder="Email Address" required>
                        </div>
                        <div class="input-group">
                            <input type="tel" placeholder="Phone Number" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <textarea placeholder="Add a special request (optional)..." rows="3"></textarea>
                    </div>
                </div>

                <button type="submit" class="login-btn full-width">Confirm Reservation</button>
            </form>
        </div>
    </main>

    <div id="qsense-chatbot" style="position: fixed; right: 22px; bottom: 22px; z-index: 9999; font-family: 'Inter', sans-serif;">
        <button id="chatbot-toggle" type="button" style="width: 64px; height: 64px; border: none; border-radius: 50%; background: linear-gradient(135deg, #3178c6, #245ea3); color: white; font-size: 28px; box-shadow: 0 12px 30px rgba(49,120,198,0.35); cursor: pointer;">💬</button>
        <div id="chatbot-panel" style="display: none; width: 340px; max-width: calc(100vw - 24px); background: white; border-radius: 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.14); border: 1px solid #e7edf3; overflow: hidden; margin-bottom: 12px;">
            <div style="padding: 14px 16px; background: #3178c6; color: white; font-weight: 700; display: flex; align-items: center; justify-content: space-between;">
                <span>Q-Sense Assistant</span>
                <button id="chatbot-close" type="button" style="background: transparent; border: none; color: white; font-size: 28px; cursor: pointer; line-height: 1;">×</button>
            </div>
            <div id="chatbot-messages" style="height: 260px; overflow-y: auto; padding: 14px; background: #f7fafd; display: flex; flex-direction: column; gap: 10px;">
                <div style="max-width: 82%; background: white; border: 1px solid #e5ecf3; border-radius: 12px 12px 12px 4px; padding: 10px 12px; color: #334; font-size: 0.92rem;">Hi! Ask about reservations, queues, table availability, or restaurant info.</div>
            </div>
            <form id="chatbot-form" style="display: flex; border-top: 1px solid #e7edf3; padding: 10px; background: white; gap: 8px;">
                <input id="chatbot-input" type="text" placeholder="Ask about bookings or queues..." style="flex: 1; border: 1px solid #dfeaf5; border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; outline: none;" />
                <button type="submit" style="background: #3178c6; color: white; border: none; border-radius: 10px; padding: 10px 14px; font-weight: 600; cursor: pointer;">Send</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Q-Sense Inc. &bull; <a href="#">Privacy</a> &bull; <a href="#">Terms</a></p>
    </footer>

  
 <script>
const profileToggle = document.getElementById('profileToggle');
const profileDropdown = document.getElementById('profileDropdown');
const logoutCustomerLink = document.getElementById('logoutCustomer');

function populateProfileMenu() {
    const name = localStorage.getItem('customer_name') || localStorage.getItem('customer_email') || 'User';
    const firstLetter = name.trim().charAt(0).toUpperCase() || 'U';
    document.getElementById('navUserInitial').textContent = firstLetter;
    document.getElementById('navUserName').textContent = name || 'Profile';
}

function closeProfileMenu() {
    profileDropdown.classList.add('hidden');
    profileToggle.setAttribute('aria-expanded', 'false');
}

profileToggle.addEventListener('click', (event) => {
    event.stopPropagation();
    const isHidden = profileDropdown.classList.toggle('hidden');
    profileToggle.setAttribute('aria-expanded', String(!isHidden));
});

document.addEventListener('click', (event) => {
    if (!event.target.closest('.profile-menu')) {
        closeProfileMenu();
    }
});

logoutCustomerLink.addEventListener('click', (event) => {
    event.preventDefault();
    localStorage.clear();
    window.location.href = 'CustomerLogin.html';
});

populateProfileMenu();

window.addEventListener("DOMContentLoaded", async () => {
  
    const userId = localStorage.getItem("customer_id");
    if(!userId) return;

    try {
        const res = await fetch(`http://localhost:5000/api/users/${userId}`);
        const data = await res.json();
        const name = data.name || 'Profile';
        document.getElementById('navUserName').textContent = name;
        document.getElementById('navUserInitial').textContent = name.charAt(0).toUpperCase();
    } catch(err) {
        console.error("Auth Error:", err);
    }

    // 2. HANDLING THE RESERVATION SUBMISSION
    const form = document.getElementById("reserveForm");
    
    if (form) {
        form.addEventListener("submit", async (e) => {
            e.preventDefault(); // Stop the page from reloading

            // Grab the data the user selected
            const restaurant_id = document.getElementById("restaurantSelect").value;
            const group_size = document.getElementById("groupSize").value;
            const reserve_date = document.getElementById("reserveDate").value;
            const reserve_time = document.getElementById("reserveTime").value;

            try {
                
                const res = await fetch("http://localhost:5000/api/reservations/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        customer_id: userId,
                        restaurant_id: restaurant_id,
                        group_size: group_size,
                        reserve_date: reserve_date,
                        reserve_time: reserve_time
                    })
                });

                const data = await res.json();

                if (res.ok) {
                   
                    window.location.href = "CustomerDashboard.html";
                } else {
                    alert(data.message || "Failed to book table.");
                }
            } catch (error) {
                console.error("Booking Error:", error);
                alert("A network error occurred. Is your backend running?");
            }
        });
    }


    
const locationDropdown = document.getElementById("restaurantSelect");

async function loadRestaurants() {
    try {
        const res = await fetch("http://localhost:5000/api/restaurant");
        const restaurants = await res.json();

        
        locationDropdown.innerHTML = '<option value="">Select a restaurant...</option>';

       
        restaurants.forEach(rest => {
            const option = document.createElement("option");
            option.value = rest.restaurant_id;
            option.textContent = rest.name;    
            locationDropdown.appendChild(option);
        });

        
        const urlParams = new URLSearchParams(window.location.search);
        const passedRestaurantId = urlParams.get('restaurant_id');
        
        if (passedRestaurantId) {
            locationDropdown.value = passedRestaurantId;
        }

    } catch (error) {
        console.error("Failed to load restaurant list:", error);
    }
}


loadRestaurants();


});

    const chatbotToggle = document.getElementById('chatbot-toggle');
    const chatbotPanel = document.getElementById('chatbot-panel');
    const chatbotClose = document.getElementById('chatbot-close');
    const chatbotForm = document.getElementById('chatbot-form');
    const chatbotInput = document.getElementById('chatbot-input');
    const chatbotMessages = document.getElementById('chatbot-messages');

    function appendChatbotMessage(text, isUser = false) {
        const bubble = document.createElement('div');
        bubble.style.maxWidth = '82%';
        bubble.style.padding = '10px 12px';
        bubble.style.borderRadius = isUser ? '12px 12px 4px 12px' : '12px 12px 12px 4px';
        bubble.style.alignSelf = isUser ? 'flex-end' : 'flex-start';
        bubble.style.background = isUser ? '#3178c6' : '#ffffff';
        bubble.style.color = isUser ? '#fff' : '#2e3a46';
        bubble.style.border = isUser ? 'none' : '1px solid #e5ecf3';
        bubble.style.fontSize = '0.92rem';
        bubble.textContent = text;
        chatbotMessages.appendChild(bubble);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
    }

    chatbotToggle.addEventListener('click', () => {
        chatbotPanel.style.display = chatbotPanel.style.display === 'none' ? 'block' : 'none';
    });

    chatbotClose.addEventListener('click', () => {
        chatbotPanel.style.display = 'none';
    });

    chatbotForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = chatbotInput.value.trim();
        if (!message) return;

        appendChatbotMessage(message, true);
        chatbotInput.value = '';

        try {
            const customerId = localStorage.getItem('customer_id');
            const response = await fetch('http://localhost:5000/api/chatbots/message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('auth_token') || ''}`
                },
                body: JSON.stringify({ message, userId: customerId })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'The assistant could not answer right now.');
            appendChatbotMessage(data.reply || 'I can help with reservations, queues, and restaurant info only.', false);
        } catch (error) {
            console.error('Chatbot request failed:', error);
            appendChatbotMessage('The assistant is unavailable right now. Please check the backend and Gemini API key.', false);
        }
    });
</script>

    <script src="js/navigation.js"></script>
</body>
</html>
